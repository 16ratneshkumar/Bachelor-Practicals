name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  check-cpp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install MinGW for Graphics Library
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-i686
    - name: Check C++ Compilation
      run: |
        # Path to the custom graphics library
        LIB_PATH="Semester-3/DSC-09 Computer Graphics/Library Setup/Packages"
        
        # Find all .cpp and .c files and try to compile them (just checking syntax)
        # Using -fsyntax-only to speed up and avoid generating binaries
        find . -name "*.cpp" -o -name "*.c" | while read -r file; do
          echo "Checking $file..."
          if grep -q "#include <graphics.h>" "$file"; then
            echo "Using MinGW for graphics library check..."
            # Using -I to point to the custom library folder
            i686-w64-mingw32-g++ -fsyntax-only -I"$LIB_PATH" "$file" || exit 1
          else
            g++ -fsyntax-only "$file" || exit 1
          fi
        done
